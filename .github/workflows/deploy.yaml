name: RabbitMQ log CI

on:
  push:
    branches:
      - main

  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gopersonalcluster/go-rabbitmq-log
  KUBE_NODE: kube-node-1

jobs:
  deploy:
    name: Deploy Golang app
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GO_PERSONAL_CLUSTER_ACTOR }}
          password: ${{ secrets.GO_PERSONAL_CLUSTER_TOKEN }}

      - name: Definir imagem
        run: |
          echo "IMAGE=ghcr.io/gopersonalcluster/go-rabbitmq-log" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t "${IMAGE}:${IMAGE_TAG}" \
            -t "${IMAGE}:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "${IMAGE}:${IMAGE_TAG}"
          docker push "${IMAGE}:latest"

      - name: Configurar kubeconfig
        run: |
          mkdir -p ~/.kube

          printf '%s' '${{ secrets.KUBE_CONFIG }}' > ~/.kube/config

          chmod 600 ~/.kube/config

          echo "Validando kubeconfig..."

          kubectl config current-context
          kubectl cluster-info
          kubectl get namespaces

      - name: Validar node Kubernetes
        run: |
          echo "Verificando node ${KUBE_NODE}..."

          kubectl get node "${KUBE_NODE}"

          echo
          echo "Status do node:"
          kubectl get node "${KUBE_NODE}" \
            -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'

          echo

      - name: Mostrar namespace.yaml
        run: |
          echo "========== namespace.yaml =========="
          cat k8s/namespace.yaml
          echo "===================================="

      - name: Mostrar deployment.yaml
        run: |
          echo "========== deployment.yaml =========="
          cat k8s/deployment.yaml
          echo "====================================="

      - name: Aplicar Kubernetes
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/postgresql.yaml

      - name: Atualizar imagem
        run: |
          echo "Atualizando Deployment..."

          kubectl -n ci set image deployment/go-rabbitmq-log \
            go-rabbitmq-log="${IMAGE}:${IMAGE_TAG}"

      - name: Verificar imagem configurada
        run: |
          echo "Imagem configurada:"

          kubectl -n ci get deployment go-rabbitmq-log \
            -o jsonpath='{.spec.template.spec.containers[0].image}'

          echo

      - name: Aguardar Deployment
        run: |
          kubectl rollout status deployment/go-rabbitmq-log \
            -n ci \
            --timeout=10m

      - name: Verificar Pods
        run: |
          echo "Pods do RabbitMQ Log:"

          kubectl get pods \
            -n ci \
            -o wide \
            -l app=go-rabbitmq-log

      - name: Verificar node dos Pods
        run: |
          echo "Node onde o Pod está executando:"

          kubectl get pods \
            -n ci \
            -l app=go-rabbitmq-log \
            -o custom-columns="POD:.metadata.name,NODE:.spec.nodeName,STATUS:.status.phase"