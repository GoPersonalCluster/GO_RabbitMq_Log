apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-rabbitmq-log
  namespace: ci
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-rabbitmq-log
  template:
    metadata:
      labels:
        app: go-rabbitmq-log
    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: go-rabbitmq-log
          image: ghcr.io/gopersonalcluster/go-rabbitmq-log:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8081
              protocol: TCP

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3 